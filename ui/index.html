<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SleepPilot</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="topProgress" class="top-progress" hidden><div></div></div>
  <div id="busyOverlay" class="busy-overlay" hidden>
    <div class="busy-card"><span class="spinner"></span><div id="busyText">Working…</div></div>
  </div>
  <div id="testBanner" class="test-banner" hidden>TEST MODE — engines are simulated. Results here are not real.</div>
  <header class="topbar">
    <a class="brand" href="#" data-act="goHome">
      <img src="icon.svg" alt="" width="30" height="30">
      <span class="brand-text">
        <span class="brand-name">SleepPilot</span>
        <span class="brand-tag">Plan. Build. Verify. Sleep.</span>
      </span>
    </a>
    <div class="top-status">
      <button id="phoneBadge" class="status-chip" data-act="openPhoneSettings" title="Control SleepPilot from your phone">📱 Phone</button>
      <button id="engineBadge" class="status-chip" data-act="goSettings" title="Engine status">Engine…</button>
      <span id="runBadge" class="status-chip" hidden></span>
    </div>
  </header>
  <div class="layout">
    <nav class="sidebar" id="sidebar">
      <button class="nav-btn" data-view="home"><span class="nav-icon">⌂</span>Home</button>
      <button class="nav-btn" data-view="project"><span class="nav-icon">▤</span>Project</button>
      <button class="nav-btn" data-view="run"><span class="nav-icon">▶</span>Run</button>
      <button class="nav-btn" data-view="preview"><span class="nav-icon">◧</span>Preview</button>
      <button class="nav-btn" data-view="android"><span class="nav-icon">▣</span>Android</button>
      <button class="nav-btn" data-view="report"><span class="nav-icon">▦</span>Report</button>
      <button class="nav-btn" data-view="insights"><span class="nav-icon">◫</span>Insights</button>
      <button class="nav-btn" data-view="reverse"><span class="nav-icon">◈</span>Reverse &amp; Rust</button>
      <button class="nav-btn" data-view="settings"><span class="nav-icon">⚙</span>Settings</button>
      <div class="sidebar-project" id="sidebarProject"></div>
      <div class="sidebar-foot">v2.6.1 · your machine, your keys · right-click for menu</div>
    </nav>
    <main id="main" class="main"></main>
  </div>
  <div id="modal" class="modal" hidden>
    <div class="modal-box" role="dialog" aria-modal="true">
      <button class="modal-close" data-act="closeModal" aria-label="Close">×</button>
      <div id="modalBody"></div>
    </div>
  </div>
  <div id="contextMenu" class="context-menu" hidden>
    <button data-act="closeApp">Close SleepPilot…</button>
    <button data-act="closeWindow">Close this window</button>
    <div class="sep"></div>
    <button data-act="reloadUi">Reload interface</button>
  </div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <script src="app.js" type="module"></script>
</body>
</html>
