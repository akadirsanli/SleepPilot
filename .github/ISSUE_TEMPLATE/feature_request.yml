name: Feature request
description: Suggest an improvement or a new engine/integration.
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or missing today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Orchestration / planning
        - Verification / checks
        - Engine or provider
        - Toolchain / Scout detection
        - Reverse & Rust
        - UI / UX
        - GitHub integration
        - CLI / integrations
        - Docs / repository
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: constraints
    attributes:
      label: Constraints
      options:
        - label: This can be done without adding npm runtime dependencies.
          required: false
        - label: I can help test this.
          required: false
