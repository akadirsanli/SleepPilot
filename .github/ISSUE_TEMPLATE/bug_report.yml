name: Bug report
description: Something does not work as documented.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please redact API keys, tokens and private paths.
        Security issues: use the private vulnerability reporting flow, not this form.
  - type: input
    id: version
    attributes:
      label: SleepPilot version
      placeholder: 2.3.0 (or the commit hash)
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11 24H2 / macOS 15 / Ubuntu 24.04
    validations:
      required: true
  - type: dropdown
    id: engine
    attributes:
      label: Engine
      options:
        - OpenCode
        - Claude Code
        - Codex CLI
        - Built-in API harness (DeepSeek/OpenAI/Anthropic/Ollama/other)
        - DeepSeek Harness (dsh)
        - Command harness
        - Project / toolchain detection (Scout)
        - Reverse & Rust
        - CLI / other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour and logs
      description: Paste the relevant log lines (redacted) or the error message.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Project type, provider/model, permission profile, whether the run was unattended, etc.
